<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生成二维码 - 民宿推广工具</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        .url-box {
            background: #f8f9ff;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            word-break: break-all;
            font-family: monospace;
            color: #667eea;
            font-weight: bold;
        }
        #qrcode {
            margin: 30px auto;
            padding: 20px;
            background: white;
            border-radius: 12px;
            display: inline-block;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.3s;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .instructions {
            text-align: left;
            margin-top: 30px;
            padding: 20px;
            background: #f8f9ff;
            border-radius: 12px;
        }
        .instructions h3 {
            color: #667eea;
            margin-bottom: 15px;
        }
        .instructions ol {
            line-height: 2;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏡 民宿推广工具 - 二维码</h1>
        <p class="subtitle">扫码即可在手机上使用</p>
        
        <div class="url-box">
            https://puyuzhen.github.io/AIpingtaitoufang/
        </div>
        
        <div id="qrcode"></div>
        
        <button class="btn" onclick="downloadQR()">📥 下载二维码</button>
        <button class="btn" onclick="copyURL()">📋 复制网址</button>
        
        <div class="instructions">
            <h3>📱 使用方法：</h3>
            <ol>
                <li><strong>扫码访问：</strong>用手机扫描二维码即可打开</li>
                <li><strong>添加到桌面：</strong>在浏览器中选择"添加到主屏幕"</li>
                <li><strong>像小程序一样使用：</strong>点击桌面图标即可打开</li>
            </ol>
            
            <h3>💡 分享给同事：</h3>
            <ol>
                <li>下载二维码图片</li>
                <li>发送到微信群或朋友圈</li>
                <li>同事扫码即可使用</li>
            </ol>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script>
        // 生成二维码
        const qrcode = new QRCode(document.getElementById("qrcode"), {
            text: "https://puyuzhen.github.io/AIpingtaitoufang/",
            width: 256,
            height: 256,
            colorDark: "#667eea",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });
        
        // 下载二维码
        function downloadQR() {
            const canvas = document.querySelector('#qrcode canvas');
            const url = canvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.download = '民宿推广工具-二维码.png';
            link.href = url;
            link.click();
            alert('二维码已下载！');
        }
        
        // 复制网址
        function copyURL() {
            const url = 'https://puyuzhen.github.io/AIpingtaitoufang/';
            navigator.clipboard.writeText(url).then(() => {
                alert('网址已复制到剪贴板！');
            }).catch(() => {
                // 备用方案
                const input = document.createElement('input');
                input.value = url;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                alert('网址已复制到剪贴板！');
            });
        }
    </script>
</body>
</html>
